name: PR validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_BASE: ${{ github.event.pull_request.base.sha }}
  NX_HEAD: ${{ github.event.pull_request.head.sha }}
  HUSKY: 0

jobs:
  repository:
    name: Repository safeguards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exactly one release type
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          selected=$(printf '%s\n' "$PR_BODY" | grep -Eic '^[[:space:]]*-[[:space:]]+\[[xX]\][[:space:]]+(Major|Minor|Patch)[[:space:]]*$' || true)
          if [ "$selected" -ne 1 ]; then
            echo "::error::Select exactly one release type: Major, Minor, or Patch."
            exit 1
          fi

      - name: Check patch whitespace
        run: git diff --check "$NX_BASE...$NX_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate PR title and commit subjects
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | npx commitlint
          test -n "$(git rev-list "$NX_BASE..$NX_HEAD")"
          npx commitlint --from "$NX_BASE" --to "$NX_HEAD" --verbose

      - name: Check formatting
        run: |
          if git diff --name-only "$NX_BASE...$NX_HEAD" | grep -Eq '^(\.prettierrc\.json|\.prettierignore|package\.json|package-lock\.json)$'; then
            npm run format:check
          else
            npx nx format:check --base="$NX_BASE" --head="$NX_HEAD"
          fi

      - name: Check repository tooling
        run: |
          npx eslint . --ignore-pattern 'apps/**' --ignore-pattern 'packages/**' --max-warnings=0
          npx tsc -p scripts/tsconfig.json
          node --test scripts/validate-commit-messages.test.ts scripts/hooks.test.ts scripts/ci-projects.test.ts
          npm run test:graph

  affected:
    name: Discover affected projects
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.projects.outputs.apps }}
      packages: ${{ steps.projects.outputs.packages }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select affected apps and packages
        id: projects
        run: node scripts/ci-projects.ts

  apps:
    name: Validate app ${{ matrix.app.name }}
    needs: affected
    if: needs.affected.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.affected.outputs.apps) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, type-check, test and build app
        env:
          PROJECT: ${{ matrix.app.name }}
        run: npx nx run-many -t lint typecheck test build --projects="$PROJECT" --output-style=static

      - name: Install Chromium
        if: matrix.app.browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        if: matrix.app.browser
        env:
          PROJECT: ${{ matrix.app.name }}
        run: npx nx run "$PROJECT:test-e2e" --output-style=static

  packages:
    name: Validate affected shared projects
    needs: affected
    if: needs.affected.outputs.packages != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, type-check, test and build shared projects
        env:
          PROJECTS: ${{ join(fromJSON(needs.affected.outputs.packages), ',') }}
        run: npx nx run-many -t lint typecheck test build --projects="$PROJECTS" --output-style=static

  validate:
    name: PR validation
    if: always()
    needs: [repository, affected, apps, packages]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check to pass
        env:
          REPOSITORY: ${{ needs.repository.result }}
          AFFECTED: ${{ needs.affected.result }}
          APPS: ${{ needs.apps.result }}
          PACKAGES: ${{ needs.packages.result }}
          APP_LIST: ${{ needs.affected.outputs.apps }}
          PACKAGE_LIST: ${{ needs.affected.outputs.packages }}
        run: |
          test "$REPOSITORY" = success
          test "$AFFECTED" = success
          if [ "$APP_LIST" = '[]' ]; then test "$APPS" = skipped; else test "$APPS" = success; fi
          if [ "$PACKAGE_LIST" = '[]' ]; then test "$PACKAGES" = skipped; else test "$PACKAGES" = success; fi
