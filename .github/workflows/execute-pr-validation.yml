name: PR validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PR validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exactly one release type
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          selected=$(printf '%s\n' "$PR_BODY" | grep -Eic '^[[:space:]]*-[[:space:]]+\[[xX]\][[:space:]]+(Major|Minor|Patch)[[:space:]]*$' || true)
          if [ "$selected" -ne 1 ]; then
            echo "::error::Select exactly one release type: Major, Minor, or Patch."
            exit 1
          fi

      - name: Validate PR title and commit subjects
        run: node scripts/validate-commit-messages.cjs

      - name: Test commit subject validation
        run: node --test scripts/validate-commit-messages.test.cjs

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Check formatting and repository tooling
        run: |
          npm run format:check
          npm run lint
          npm run test:graph
          node --test scripts/hooks.test.cjs

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run affected quality checks
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx nx affected -t lint typecheck test build --output-style=static

      - name: Run affected browser tests
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx nx affected -t test-e2e --output-style=static
